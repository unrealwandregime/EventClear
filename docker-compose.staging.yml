services:
  api:
    env_file:
      - infrastructure/deployment/staging.env
      - config/deployments/staging.env
    restart: unless-stopped
  solver:
    restart: unless-stopped
  indexer:
    env_file:
      - infrastructure/deployment/staging.env
      - config/deployments/staging.env
    restart: unless-stopped
  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?required}
    volumes:
      - eventclear-staging-objects:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.4.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
    volumes:
      - ./infrastructure/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/eventclear.json:ro
    ports: ["3001:3000"]
    restart: unless-stopped

volumes:
  eventclear-staging-objects:
