[project]
name = "eventclear-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "pydantic==2.11.7",
  "httpx==0.28.1",
  "eth-account==0.13.7",
  "eth-abi==5.2.0",
  "eth-utils==5.3.1",
  "prometheus-client==0.22.1",
  "psycopg[binary]==3.2.9",
  "redis==6.2.0",
  "boto3==1.40.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../solver/src"]
markers = [
  "contract_integration: calls contracts deployed to a real Anvil JSON-RPC process",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventclear_api"]
