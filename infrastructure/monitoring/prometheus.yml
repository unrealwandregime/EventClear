global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: eventclear-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: eventclear-services
    metrics_path: /health
    static_configs:
      - targets: ["solver:8001"]
