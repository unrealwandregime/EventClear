groups:
  - name: eventclear-staging
    rules:
      - alert: EventClearApiUnavailable
        expr: up{job="eventclear-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "EventClear staging API unavailable" }
      - alert: EventClearSolverUnavailable
        expr: up{job="eventclear-services"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "EventClear staging solver unavailable" }
      - alert: EventClearApiErrorRate
        expr: sum(rate(eventclear_api_requests_total{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Elevated EventClear API errors" }
      - alert: EventClearQuoteRejectionSpike
        expr: sum(rate(eventclear_quote_rejections_total[5m])) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Quote rejection spike" }
      - alert: EventClearIndexerLag
        expr: eventclear_indexer_block_lag > 20
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Indexer is more than 20 blocks behind" }
      - alert: EventClearPoolUtilizationHigh
        expr: eventclear_pool_utilization_bps > 7000
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Pool utilization exceeds staging threshold" }
      - alert: EventClearSettlementFailure
        expr: increase(eventclear_settlement_failures_total[10m]) > 0
        labels: { severity: critical }
        annotations: { summary: "A staging settlement failed" }
