name: Controlled external staging
on:
  workflow_dispatch:
    inputs:
      action:
        description: Protected staging operation (never mainnet)
        required: true
        type: choice
        options: [preflight, provision-infra, deploy-contracts, deploy-services, remote-lifecycle, monitoring-check, rollback-services, destroy-infra]
      release_ref:
        description: Reviewed full commit SHA on default branch or approved tag
        required: true
        type: string
      evidence_run_id:
        description: Successful deploy-contracts run providing verified manifest; rollback uses deploy-services run
        type: string
      allow_aws_provision:
        description: Explicitly allow billable staging infrastructure (budget variable required)
        type: boolean
        default: false
      destroy_confirmation:
        description: Exact staging stack name required for destruction
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: eventclear-external-staging
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_STACK_EXECUTION_ROLE_ARN: ${{ vars.AWS_STACK_EXECUTION_ROLE_ARN }}
      STAGING_STACK_NAME: ${{ vars.STAGING_STACK_NAME }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
      STAGING_HOSTED_ZONE_ID: ${{ vars.STAGING_HOSTED_ZONE_ID }}
      STAGING_ALERT_EMAIL: ${{ vars.STAGING_ALERT_EMAIL }}
      STAGING_BUDGET_USD: ${{ vars.STAGING_BUDGET_USD }}
      STAGING_CHAIN_ID: ${{ vars.STAGING_CHAIN_ID }}
      STAGING_ADMIN_ADDRESS: ${{ vars.STAGING_ADMIN_ADDRESS }}
      STAGING_TEST_ASSETS_ONLY: "true"
      ENABLE_MAINNET_EXECUTION: "false"
      PUBLIC_CAPITAL_ACTIVATED: "false"
      STAGING_RPC_PRIMARY: ${{ secrets.STAGING_RPC_PRIMARY }}
      STAGING_RPC_FALLBACK: ${{ secrets.STAGING_RPC_FALLBACK }}
      STAGING_DEPLOYER_PRIVATE_KEY: ${{ secrets.STAGING_DEPLOYER_PRIVATE_KEY }}
      STAGING_LP_PRIVATE_KEY: ${{ secrets.STAGING_LP_PRIVATE_KEY }}
      STAGING_TEST_EOA_PRIVATE_KEY: ${{ secrets.STAGING_TEST_EOA_PRIVATE_KEY }}
      ALLOW_AWS_PROVISION: ${{ inputs.allow_aws_provision && 'true' || 'false' }}
      ALLOW_STAGING_DESTROY: ${{ inputs.destroy_confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.release_ref }}", fetch-depth: 0 }
      - name: Require reviewed release ancestry
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_REF")"
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            [[ "$RELEASE_REF" == refs/tags/* ]] || exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install locked project tools
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -e apps/solver -e apps/api pytest cfn-lint
          cd packages/contracts
          forge install OpenZeppelin/openzeppelin-contracts@v5.4.0 foundry-rs/forge-std@v1.9.7 --no-git
      - name: Validate software gates
        run: |
          set -euo pipefail
          cfn-lint infrastructure/aws/bootstrap/template.json infrastructure/aws/staging/template.json
          node --test tests/staging/*.test.mjs
          python -m pytest tests/staging/test_staging.py apps/solver/tests apps/api/tests -q
          pnpm typecheck
          forge build --root packages/contracts
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: AWS identity and template validation
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query Account --output text
          aws cloudformation validate-template --template-body file://infrastructure/aws/bootstrap/template.json >/dev/null
          aws cloudformation validate-template --template-body file://infrastructure/aws/staging/template.json >/dev/null
      - name: Retrieve prior immutable evidence
        if: contains(fromJSON('["deploy-services","remote-lifecycle","rollback-services"]'), inputs.action)
        env:
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          STAGING_ACTION: ${{ inputs.action }}
        run: node scripts/aws/restore-evidence.mjs
      - name: Preflight
        if: inputs.action == 'preflight'
        run: node scripts/staging-external-preflight.mjs
      - name: Deploy test-only contracts
        if: inputs.action == 'deploy-contracts'
        run: node scripts/aws/deploy-contracts.mjs
      - name: Build immutable service images
        if: inputs.action == 'deploy-services'
        run: |
          set -euo pipefail
          prefix="$(node scripts/aws/read-staging-outputs.mjs | python -c 'import sys,json; print(json.load(sys.stdin)["EcrPrefix"])')"
          registry="${prefix%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          sha="$(git rev-parse HEAD)"
          for service in web api solver indexer migration; do
            image="$prefix-$service:$sha"
            if aws ecr describe-images --repository-name "$STAGING_STACK_NAME-$service" --image-ids "imageTag=$sha" >/dev/null 2>&1; then continue; fi
            docker build -f "infrastructure/docker/$service.Dockerfile" -t "$image" .
            docker push "$image"
          done
      - name: Execute protected AWS operation
        if: contains(fromJSON('["provision-infra","deploy-services","monitoring-check","rollback-services","destroy-infra"]'), inputs.action)
        env:
          STAGING_ACTION: ${{ inputs.action }}
        run: node scripts/aws/operate.mjs "$STAGING_ACTION"
      - name: Run full remote test-asset lifecycle
        if: inputs.action == 'remote-lifecycle'
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/run-remote-staging-lifecycle.mjs
          pnpm exec playwright test --config playwright.staging.config.ts --grep remote\ final-state
          node scripts/aws/revalidate-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-evidence-${{ inputs.action }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            outputs/staging/*.json
            config/contracts/staging.json
            config/staging/deployed.json
            docs/STAGING_DEPLOYMENT_RECORD.md
            docs/STAGING_LIFECYCLE_EVIDENCE.md
            docs/STAGING_MONITORING_EVIDENCE.md
