name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm indexer:test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e apps/solver -e apps/api pytest ruff==0.15.21
      - run: ruff format --check apps
      - run: ruff check apps
      - run: pytest apps/solver/tests apps/api/tests
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - working-directory: packages/contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.4.0 foundry-rs/forge-std --no-git
          forge fmt --check
          forge test -vvv
          forge build --sizes
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install slither-analyzer
      - working-directory: packages/contracts
        run: slither . --config-file ../../slither.config.json
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: anchore/scan-action@v6
        with: { path: ".", fail-build: false, severity-cutoff: high }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm audit --audit-level critical
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
  linux-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cp .env.example .env
      - run: make install
      - run: make test
      - run: docker compose up --detach anvil
      - run: make demo-lifecycle
      - if: always()
        run: docker compose down --volumes
  polygon-fork:
    runs-on: ubuntu-latest
    env:
      POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - working-directory: packages/contracts
        run: |
          if [ -z "$POLYGON_RPC_URL" ]; then
            echo "Polygon fork test not configured; POLYGON_RPC_URL is absent."
            exit 0
          fi
          forge test --match-path "test/fork/*" --fork-url "$POLYGON_RPC_URL" --fork-block-number 90963627
