name: Zero-cost prototype health
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'
permissions:
  contents: read
concurrency:
  group: prototype-health
  cancel-in-progress: false
jobs:
  health:
    if: github.event_name == 'workflow_dispatch' || vars.PROTOTYPE_MONITORING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: node scripts/prototype/health.mjs
        env:
          PROTOTYPE_URL: ${{ vars.PROTOTYPE_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prototype-health
          path: prototype-health.json
